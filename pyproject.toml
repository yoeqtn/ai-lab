[project]
name = "ai-lab"
version = "0.2.0"
description = "企业客服 Agent：FastAPI + LangGraph + RAG（pgvector）"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.0",
    "langchain-openai>=1.7.3",
    "langgraph>=1.2.19",
    "langgraph-checkpoint-postgres>=3.2.0",
    "openai>=3.42.1",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.8",
    "pypdf>=6.21.4",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.33",
    "sqlalchemy[asyncio]>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]        # 行宽由 formatter 处理，不阻塞 CI

[tool.ruff.lint.per-file-ignores]
# 迁移文件是生成/历史代码，不强求风格
"alembic/versions/*" = ["E", "F", "I", "UP"]
# 零散练习代码，故意保持原样
"scripts/scratch/*" = ["E", "F", "I", "UP", "B", "SIM"]
